services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PIPELINE_DEMO_MODE=true
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1
    volumes:
      - ./frontend:/app
    depends_on:
      - api
